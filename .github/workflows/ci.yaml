name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# The 12-module list is repeated in each job's matrix below because:
#   1. GitHub Actions does not expand YAML anchors inside `matrix:` keys
#   2. The `env` context is not available at matrix-evaluation time
#   3. A setup-job + fromJSON(needs...) approach failed matrix expansion
#      silently in this repo (matrix jobs never started)
# When adding or removing a module, update all five lists below AND
# .github/modules.json (kept in sync for documentation / future use).
#
# Each module entry is an object with:
#   path: the Go module path (used for `go test ./<path>/...`, coverage files, cache key)
#   name: an artifact-safe identifier (no `/`), used in the coverage-artifact name
# The `name` exists because GitHub artifact names must match [A-Za-z0-9_-],
# and the matrix `path` contains `/` for grouped modules like `pkg/argo/cd`.

jobs:
  fmt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { path: pkg/utils, name: pkg-utils }
          - { path: pkg/k8s, name: pkg-k8s }
          - { path: pkg/certmanager, name: pkg-certmanager }
          - { path: pkg/externalsecrets, name: pkg-externalsecrets }
          - { path: pkg/flux, name: pkg-flux }
          - { path: pkg/istio, name: pkg-istio }
          - { path: pkg/linkerd, name: pkg-linkerd }
          - { path: pkg/velero, name: pkg-velero }
          - { path: pkg/argo/cd, name: pkg-argo-cd }
          - { path: pkg/argo/events, name: pkg-argo-events }
          - { path: pkg/argo/rollouts, name: pkg-argo-rollouts }
          - { path: pkg/argo/workflows, name: pkg-argo-workflows }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module.path }}/go.sum'
      - name: Check go fmt
        run: |
          UNFORMATTED=$(gofmt -l ${{ matrix.module.path }})
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd in ${{ matrix.module.path }}. Run: go fmt ./..."
            echo "$UNFORMATTED"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { path: pkg/utils, name: pkg-utils }
          - { path: pkg/k8s, name: pkg-k8s }
          - { path: pkg/certmanager, name: pkg-certmanager }
          - { path: pkg/externalsecrets, name: pkg-externalsecrets }
          - { path: pkg/flux, name: pkg-flux }
          - { path: pkg/istio, name: pkg-istio }
          - { path: pkg/linkerd, name: pkg-linkerd }
          - { path: pkg/velero, name: pkg-velero }
          - { path: pkg/argo/cd, name: pkg-argo-cd }
          - { path: pkg/argo/events, name: pkg-argo-events }
          - { path: pkg/argo/rollouts, name: pkg-argo-rollouts }
          - { path: pkg/argo/workflows, name: pkg-argo-workflows }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module.path }}/go.sum'
      - name: Run go vet
        run: go vet ./${{ matrix.module.path }}/...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { path: pkg/utils, name: pkg-utils }
          - { path: pkg/k8s, name: pkg-k8s }
          - { path: pkg/certmanager, name: pkg-certmanager }
          - { path: pkg/externalsecrets, name: pkg-externalsecrets }
          - { path: pkg/flux, name: pkg-flux }
          - { path: pkg/istio, name: pkg-istio }
          - { path: pkg/linkerd, name: pkg-linkerd }
          - { path: pkg/velero, name: pkg-velero }
          - { path: pkg/argo/cd, name: pkg-argo-cd }
          - { path: pkg/argo/events, name: pkg-argo-events }
          - { path: pkg/argo/rollouts, name: pkg-argo-rollouts }
          - { path: pkg/argo/workflows, name: pkg-argo-workflows }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module.path }}/go.sum'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Run golangci-lint
        run: golangci-lint run ./${{ matrix.module.path }}/...

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { path: pkg/utils, name: pkg-utils }
          - { path: pkg/k8s, name: pkg-k8s }
          - { path: pkg/certmanager, name: pkg-certmanager }
          - { path: pkg/externalsecrets, name: pkg-externalsecrets }
          - { path: pkg/flux, name: pkg-flux }
          - { path: pkg/istio, name: pkg-istio }
          - { path: pkg/linkerd, name: pkg-linkerd }
          - { path: pkg/velero, name: pkg-velero }
          - { path: pkg/argo/cd, name: pkg-argo-cd }
          - { path: pkg/argo/events, name: pkg-argo-events }
          - { path: pkg/argo/rollouts, name: pkg-argo-rollouts }
          - { path: pkg/argo/workflows, name: pkg-argo-workflows }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module.path }}/go.sum'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ./${{ matrix.module.path }}/...

  test:
    needs: [fmt, vet, lint, vulncheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - { path: pkg/utils, name: pkg-utils }
          - { path: pkg/k8s, name: pkg-k8s }
          - { path: pkg/certmanager, name: pkg-certmanager }
          - { path: pkg/externalsecrets, name: pkg-externalsecrets }
          - { path: pkg/flux, name: pkg-flux }
          - { path: pkg/istio, name: pkg-istio }
          - { path: pkg/linkerd, name: pkg-linkerd }
          - { path: pkg/velero, name: pkg-velero }
          - { path: pkg/argo/cd, name: pkg-argo-cd }
          - { path: pkg/argo/events, name: pkg-argo-events }
          - { path: pkg/argo/rollouts, name: pkg-argo-rollouts }
          - { path: pkg/argo/workflows, name: pkg-argo-workflows }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module.path }}/go.sum'
      - name: Run tests with coverage
        run: go test -v -coverprofile=${{ matrix.module.path }}/coverage.out -covermode=atomic ./${{ matrix.module.path }}/...
      - name: Show coverage summary
        if: always()
        run: go tool cover -func=${{ matrix.module.path }}/coverage.out | tail -1
      - name: Generate HTML coverage report
        if: always()
        run: go tool cover -html=${{ matrix.module.path }}/coverage.out -o ${{ matrix.module.path }}/coverage.html
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.name }}
          path: |
            ${{ matrix.module.path }}/coverage.out
            ${{ matrix.module.path }}/coverage.html
          retention-days: 90
