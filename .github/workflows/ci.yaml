name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

# The 12-module list is repeated in each job's matrix below because:
#   1. GitHub Actions does not expand YAML anchors inside `matrix:` keys
#   2. The `env` context is not available at matrix-evaluation time
#   3. A setup-job + fromJSON(needs...) approach failed matrix expansion
#      silently in this repo (matrix jobs never started)
# When adding or removing a module, update all five lists below AND
# .github/modules.json (kept in sync for documentation / future use).

jobs:
  fmt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/utils
          - pkg/k8s
          - pkg/certmanager
          - pkg/externalsecrets
          - pkg/flux
          - pkg/istio
          - pkg/linkerd
          - pkg/velero
          - pkg/argo/cd
          - pkg/argo/events
          - pkg/argo/roll
          - pkg/argo/workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Check go fmt
        run: |
          UNFORMATTED=$(gofmt -l ${{ matrix.module }})
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd in ${{ matrix.module }}. Run: go fmt ./..."
            echo "$UNFORMATTED"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/utils
          - pkg/k8s
          - pkg/certmanager
          - pkg/externalsecrets
          - pkg/flux
          - pkg/istio
          - pkg/linkerd
          - pkg/velero
          - pkg/argo/cd
          - pkg/argo/events
          - pkg/argo/roll
          - pkg/argo/workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Run go vet
        run: go vet ${{ matrix.module }}/...

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/utils
          - pkg/k8s
          - pkg/certmanager
          - pkg/externalsecrets
          - pkg/flux
          - pkg/istio
          - pkg/linkerd
          - pkg/velero
          - pkg/argo/cd
          - pkg/argo/events
          - pkg/argo/roll
          - pkg/argo/workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ${{ matrix.module }}/...

  vulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/utils
          - pkg/k8s
          - pkg/certmanager
          - pkg/externalsecrets
          - pkg/flux
          - pkg/istio
          - pkg/linkerd
          - pkg/velero
          - pkg/argo/cd
          - pkg/argo/events
          - pkg/argo/roll
          - pkg/argo/workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ${{ matrix.module }}/...

  test:
    needs: [fmt, vet, lint, vulncheck]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - pkg/utils
          - pkg/k8s
          - pkg/certmanager
          - pkg/externalsecrets
          - pkg/flux
          - pkg/istio
          - pkg/linkerd
          - pkg/velero
          - pkg/argo/cd
          - pkg/argo/events
          - pkg/argo/roll
          - pkg/argo/workflows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Run tests
        run: go test -v ${{ matrix.module }}/...
