name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# The matrix list of every go module in the repo is the SINGLE SOURCE OF TRUTH
# in .github/modules.json. A setup job reads it and exposes it as a job output,
# which the fmt / vet / lint / vulncheck / test jobs then fromJSON() into their
# matrix. Adding or removing a module is now a one-line change to the JSON
# file - no need to edit five matrices in this file, and no risk of a stale
# directory name causing matrix expansion to reference a non-existent path.
jobs:
  modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.read.outputs.modules }}
    steps:
      - id: read
        run: echo "modules=$(jq -c . .github/modules.json)" >> "$GITHUB_OUTPUT"

  fmt:
    needs: [modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Check go fmt
        run: |
          UNFORMATTED=$(gofmt -l ${{ matrix.module }})
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd in ${{ matrix.module }}. Run: go fmt ./..."
            echo "$UNFORMATTED"
            exit 1
          fi

  vet:
    needs: [modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Run go vet
        run: go vet ${{ matrix.module }}/...

  lint:
    needs: [modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ${{ matrix.module }}/...

  vulncheck:
    needs: [modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        continue-on-error: true
        run: govulncheck ${{ matrix.module }}/...

  test:
    needs: [fmt, vet, lint, vulncheck, modules]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '${{ matrix.module }}/go.sum'
      - name: Run tests
        run: go test -v ${{ matrix.module }}/...
