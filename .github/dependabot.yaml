version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/pkg/utils"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "github.com/external-secrets/external-secrets"
        update-types: ["version-update:semver-major"]
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"

